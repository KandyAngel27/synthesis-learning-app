<!DOCTYPE html>
<html>
<head><title>Debug Lessons</title></head>
<body>
<h1>HITT 1305 Lesson Debug</h1>
<pre id="output">Loading...</pre>
<script src="medical-coding-data.js"></script>
<script src="art-history-v2.js"></script>
<script src="data.js"></script>
<script>
try {
    const book = getBookById('hitt-1305');
    let out = 'lessonList length: ' + book.lessonList.length + '\n\n';
    book.lessonList.forEach((l, i) => {
        out += 'Lesson ' + l.id + ': ' + l.title + ' (cards: ' + (l.cards ? l.cards.length : 0) + ')\n';
    });
    document.getElementById('output').textContent = out;
} catch(e) {
    document.getElementById('output').textContent = 'ERROR: ' + e.message + '\n' + e.stack;
}
</script>
</body>
</html>
